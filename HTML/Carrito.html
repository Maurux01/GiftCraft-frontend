<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftcraft - Carrito</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Iconos Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- Fuentes: pixel (títulos) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Gugi&family=Londrina+Shadow&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Rubik+Spray+Paint&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Fascinate&family=Gugi&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Londrina+Shadow&family=Oswald:wght@200..700&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Rubik+Spray+Paint&family=Silkscreen:wght@400;700&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">

    <!--css-->
    <link href="CSS/style.css" rel="stylesheet">
    <link href="../CSS/contact.css" rel="stylesheet">
    <style>
        .cart-item-img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 12px;
        }

        .qty-input {
            width: 70px;
            text-align: center;
        }

        .payment-option {
            border: 2px solid #e2d2b8;
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all .2s ease;
        }

        .payment-option:hover {
            border-color: #8B6955;
        }

        .payment-option.active {
            border-color: #8B6955;
            background-color: #FFF7E8;
        }

        .payment-option .form-check-input {
            margin-top: .35rem;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <!-- Banner -->
    <section class="hero-banner container-fluid p-0 d-flex align-items-center justify-content-center text-center">
        <div class="container text-center py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="banner-madera p-4 rounded-4 shadow-lg position-relative d-inline-block w-100">
                        <h1 class="display-4 fw-bold text-white mb-0">Tu Carrito</h1>
                    </div>
                    <div class="banner-subtitle d-inline-flex align-items-center gap-2 px-4 py-2 rounded-pill shadow-sm">
                        <span class="fw-bold text-dark">Revisa tus productos y finaliza tu compra</span>
                        <span>🛒</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <main class="container py-4 contenido-principal">
        <div class="row g-4 align-items-start">

            <!-- COLUMNA IZQUIERDA: Productos del carrito -->
            <div class="col-12 col-lg-8">
                <div class="card card-crema border-0 p-3 p-md-4 rounded-4 shadow-sm">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h2 class="h5 fw-bold mb-0"><i class="bi bi-bag-check-fill"></i> Productos en tu carrito</h2>
                        <span class="badge bg-secondary rounded-pill" id="contador-articulos"></span>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Producto</th>
                                    <th scope="col" class="text-center">Precio</th>
                                    <th scope="col" class="text-center">Cantidad</th>
                                    <th scope="col" class="text-center">Subtotal</th>
                                    <th scope="col" class="text-center">Quitar</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-carrito"></tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <a href="productos.html" class="btn btn-outline-secondary rounded-pill">
                            <i class="bi bi-arrow-left"></i> Seguir comprando
                        </a>
                        <button class="btn btn-outline-danger rounded-pill">
                            <i class="bi bi-x-circle"></i> Vaciar carrito
                        </button>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Resumen y pago -->
            <div class="col-12 col-lg-4">
                <div class="card card-crema border-0 p-3 p-md-4 rounded-4 shadow-sm mb-4">
                    <h2 class="h5 fw-bold mb-3"><i class="bi bi-receipt"></i> Resumen del pedido</h2>
                    <ul class="list-group list-group-flush mb-3">
                        <li class="list-group-item d-flex justify-content-between bg-transparent px-0">
                            <span>Subtotal</span>
                            <span class="fw-bold" id="resumen-subtotal"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between bg-transparent px-0">
                            <span>Envío</span>
                            <span class="fw-bold" id="resumen-envio"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between bg-transparent px-0 border-top">
                            <span class="fw-bold">Total</span>
                            <span class="fw-bold fs-5 text-success" id="resumen-total">$158.000</span>
                        </li>
                    </ul>
                </div>

                <div class="card card-crema border-0 p-3 p-md-4 rounded-4 shadow-sm">
                    <h2 class="h5 fw-bold mb-3"><i class="bi bi-credit-card-2-front"></i> Opciones de pago</h2>

                    <div class="d-grid gap-2 mb-3">
                        <label class="payment-option d-flex align-items-center gap-3 active">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoTarjeta" checked>
                            <div class="flex-grow-1">
                                <div class="fw-bold">Tarjeta de crédito/débito</div>
                                <small class="text-muted">Visa y MasterCard</small>
                            </div>
                            <i class="bi bi-credit-card fs-4 text-primary"></i>
                        </label>

                        <label class="payment-option d-flex align-items-center gap-3">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoPSE">
                            <div class="flex-grow-1">
                                <div class="fw-bold">PSE</div>
                                <small class="text-muted">Pago desde tu cuenta bancaria</small>
                            </div>
                            <i class="bi bi-bank fs-4 text-success"></i>
                        </label>

                        <label class="payment-option d-flex align-items-center gap-3">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoBreB">
                            <div class="flex-grow-1">
                                <div class="fw-bold">Bre-B</div>
                                <small class="text-muted">Pago rápido y seguro</small>
                            </div>
                            <i class="bi bi-qr-code-scan fs-4 text-warning"></i>
                        </label>
                    </div>

                    <!-- Datos de tarjeta (demo) -->
                    <div id="datosTarjeta" class="mb-3">
                        <div class="mb-2">
                            <label for="numeroTarjeta" class="form-label small fw-bold">Número de tarjeta</label>
                            <input type="text" class="form-control" id="numeroTarjeta" placeholder="1234 5678 9012 3456">
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label for="fechaTarjeta" class="form-label small fw-bold">Vencimiento</label>
                                <input type="text" class="form-control" id="fechaTarjeta" placeholder="MM/AA">
                            </div>
                            <div class="col-6">
                                <label for="cvvTarjeta" class="form-label small fw-bold">CVV</label>
                                <input type="text" class="form-control" id="cvvTarjeta" placeholder="123">
                            </div>
                        </div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="aceptaTerminos" required>
                        <label class="form-check-label small" for="aceptaTerminos">
                            Acepto los términos y condiciones de compra.
                        </label>
                    </div>

                    <button type="button" class="btn btn-verde-minecraft w-100 py-2 fw-bold text-white rounded-pill shadow" id="btn-pagar">
                        <i class="bi bi-lock-fill"></i>
                    </button>

                    <p class="text-center text-muted small mt-3 mb-0">
                        <i class="bi bi-shield-lock-fill"></i> Pago seguro y encriptado
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- personal JS -->
     <script src="../JS/Carrito/carrito.js"> </script>
    <script src="../JS/components.js"></script>
</body>

</html>
