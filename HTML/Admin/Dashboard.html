<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftcraft</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Iconos Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- Fuentes: pixel (títulos) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Gugi&family=Londrina+Shadow&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Rubik+Spray+Paint&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Fascinate&family=Gugi&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Londrina+Shadow&family=Oswald:wght@200..700&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Rubik+Spray+Paint&family=Silkscreen:wght@400;700&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">


    <!--css-->
    <link href="../../CSS/style.css" rel="stylesheet">
    <link href="../../CSS/Admin-CSS/dashboard-admin.css" rel="stylesheet">
</head>


<body>
    <!--Header-->
    <div id="header-placeholder"></div>
    <main class="container py-4 contenido-principal">
        <div class="d-flex align-items-center gap-3">
            <img src="/ASSETS/img/bloque-tierra.png" alt="" width="64" class="pixel-art">
            <div class="titulo">
                <h1 class="h3 m-0 fw-bold titulo-admin">Panel de Administrador</h1>
                <p class="m-0 small">Gestiona tus productos y haz crecer tu tienda.</p>
            </div>
        </div>



        <br>

        <!-- Botón para activar el Modal -->
        <button type="button" class="btn btn-verde-minecraft mb-3" data-bs-toggle="modal"
            data-bs-target="#modalAgregarProducto">
            + Agregar nuevo producto
        </button>

        <div class="card card-crema border-0 rounded-4 shadow-sm p-3 mb-3">
            <!-- Encabezados de la lista (Suman exactamente 12 columnas: 1+2+2+2+1+1+1+2 = 12) -->
            <div class="row align-items-center text-muted fw-bold pb-2 border-bottom d-none d-md-flex">
                <div class="col-md-1 text-nowrap"><i class="bi bi-image me-1"></i> Imagen</div>
                <div class="col-md-2 text-nowrap"><i class="bi bi-tag me-1"></i> Nombre</div>
                <div class="col-md-2 text-nowrap"><i class="bi bi-folder me-1"></i> Categoría</div>
                <div class="col-md-2 text-nowrap">Descripción</div>
                <div class="col-md-1 text-nowrap">Precio</div>
                <div class="col-md-1 text-nowrap">Stock</div>
                <div class="col-md-1 text-nowrap">Colores</div>
                <div class="col-md-1 text-nowrap">Tamaño</div>
                <div class="col-md-1 text-md-end text-nowrap">Acciones</div>
            </div>

            <!-- Fila producto (Mismas proporciones exactas de columnas) -->
            <div class="col-12" id="listaProductosContainer">
                <!-- Aquí se pintarán automáticamente todos los productos guardados en localstorage-->
            </div>
        </div>




        <!-- boton agregar nuevo producto- -->
        <div class="modal fade" id="modalAgregarProducto" tabindex="-1" aria-labelledby="modalAgregarProductoLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <!-- Encabezado del Modal -->
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalAgregarProductoLabel">📦 Agregar nuevo producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <!-- Cuerpo del Modal (Formulario) -->
                    <div class="modal-body">
                        <form id="formProducto">
                            <div class="row g-3">

                                <!-- Nombre del Producto -->
                                <div class="col-md-6">
                                    <label for="nombreProducto" class="form-label">Nombre del producto *</label>
                                    <input type="text" class="form-control" id="nombreProducto"
                                        placeholder="Ej: Flor Azul" required>
                                </div>

                                <!-- Categoría -->
                                <div class="col-md-6">
                                    <label for="categoriaProducto" class="form-label">Categoría *</label>
                                    <select class="form-select" id="categoriaProducto" required>
                                        <option value="Plantas" selected>Plantas</option>
                                        <option value="animales">Animales</option>
                                    </select>
                                </div>

                                <!-- Descripción -->
                                <div class="col-12">
                                    <label for="descripcionProducto" class="form-label">Descripción *</label>
                                    <textarea class="form-control" id="descripcionProducto" rows="3"
                                        placeholder="Describe tu producto..." required></textarea>
                                </div>

                                <!-- Precio (COP) -->
                                <div class="col-md-6">
                                    <label for="precioProducto" class="form-label">Precio (COP) *</label>
                                    <input type="text" class="form-control" id="precioProducto" placeholder="Ej: 25.000"
                                        required>
                                </div>

                                <!-- Stock -->
                                <div class="col-md-6">
                                    <label for="stockProducto" class="form-label">Stock *</label>
                                    <input type="number" class="form-control" id="stockProducto" placeholder="Ej: 50"
                                        required>
                                </div>

                                <!-- Colores disponibles -->
                                <div class="col-md-6">
                                    <label class="form-label">Colores disponibles *</label>
                                    <div class="d-flex gap-1 align-items-center">
                                        <!-- Selectores de color nativos simples alineados en fila -->
                                        <input type="color" class="form-control form-control-color input-color" value="#ff0000"
                                            title="Color 1" id="color1">
                                        <input type="color" class="form-control form-control-color input-color" value="#00ff00"
                                            title="Color 2" id="color2">
                                        <input type="color" class="form-control form-control-color input-color" value="#0000ff"
                                            title="Color 3" id="color3">
                                        <button type="button" class="btn btn-outline-secondary btn-sm">+</button>
                                    </div>
                                </div>

                                <!-- Tamaños disponibles -->
                                <div class="col-md-6">
                                    <label class="form-label">Tamaños disponibles *</label>
                                    <div class="d-flex gap-1">
                                        <!-- Checkboxes estilizados como botones simples de Bootstrap (S, M, L) -->
                                        <input type="checkbox" class="btn-check" id="sizeS" autocomplete="off">
                                        <label class="btn btn-outline-secondary btn-sm" for="sizeS">S</label>

                                        <input type="checkbox" class="btn-check" id="sizeM" autocomplete="off">
                                        <label class="btn btn-outline-secondary btn-sm" for="sizeM">M</label>

                                        <input type="checkbox" class="btn-check" id="sizeL" autocomplete="off">
                                        <label class="btn btn-outline-secondary btn-sm" for="sizeL">L</label>
                                    </div>
                                </div>

                                <!-- Agregar imágenes -->
                                <div class="col-12">
                                    <label for="imagenesProducto" class="form-label">Agregar imágenes *</label>
                                    <div class="border rounded p-4 text-center bg-light">
                                        <input type="file" class="form-control d-none" id="imagenesProducto"
                                            accept="image/*" required>
                                        <label for="imagenesProducto" style="cursor: pointer;"
                                            class="text-muted d-block">
                                            <p class="mb-1">🔄 Arrastra tus imágenes aquí o selecciona archivos</p>
                                            <small>JPG, PNG • Máx. 5 MB</small>
                                        </label>
                                    </div>
                                </div>

                            </div>
                        </form>
                    </div>

                    <!-- Botones Cancelar y Guardar en Modal -->
                    <div class="modal-footer d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">❌
                            Cancelar</button>
                        <button type="submit" form="formProducto" class="btn btn-primary">💾 Guardar producto</button>
                    </div>

                </div>
            </div>
        </div>
    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- personal JS -->
    <script src="../../JS/components.js"></script>
    <script src="../../JS/Admin-JS/Dashboard.js"></script>
</body>

</html>
