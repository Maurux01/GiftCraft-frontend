<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftcraft</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Iconos Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- Fuentes: pixel (títulos) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Gugi&family=Londrina+Shadow&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Rubik+Spray+Paint&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Fascinate&family=Gugi&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Londrina+Shadow&family=Oswald:wght@200..700&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Rubik+Spray+Paint&family=Silkscreen:wght@400;700&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
    <!--css-->
    <link href="../CSS/productos.css" rel="stylesheet">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="container py-4">
        <div class="row row-cols-1 row-cols-md-3 g-3" id="contenedorProductos">
            <!-- Aquí se insertan dinámicamente las cards -->

        </div>
    </main>

    <!-- Offcanvas carrito (lado derecho) -->
     
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCart" aria-labelledby="offcanvasCartLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasCartLabel"><i class="bi bi-cart3"></i> Tu carrito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between align-items-center" data-precio="45000">
                    <span>Figura Steve</span>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-primary rounded-pill">$45.000</span>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                            aria-label="Eliminar Figura Steve">Eliminar</button>
                    </div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center" data-precio="76000">
                    <span>Figura Creeper x2</span>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-primary rounded-pill">$76.000</span>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                            aria-label="Eliminar Figura Creeper x2">Eliminar</button>
                    </div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center" data-precio="25000">
                    <span>Bloque de Tierra</span>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-primary rounded-pill">$25.000</span>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                            aria-label="Eliminar Bloque de Tierra">Eliminar</button>
                    </div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center fw-bold">
                    Total
                    <span class="badge bg-success rounded-pill">$146.000</span>
                </li>
            </ul>
            <div class="d-grid gap-2">
                <a href="Carrito.html" class="btn btn-primary">Ir al carrito</a>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="offcanvas">Seguir
                    comprando</button>
            </div>
        </div>
    </div>

    <!-- MODAL personalizar-->
    <!-- Modal de Personalización Centrado -->
    <div class="modal fade" id="modalPersonalizarProducto" tabindex="-1" aria-labelledby="modalPersonalizarLabel"
        aria-hidden="true">
        <!-- modal-xl o modal-lg para dar buen espacio a las dos columnas -->
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <!-- Encabezado con el botón de cerrar X -->
                <div class="modal-header border-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Cuerpo del Modal en dos columnas -->
                <div class="modal-body pt-0">
                    <div class="row g-4 align-items-center">

                        <!-- COLUMNA IZQUIERDA: Contenedor único para la Imagen Dinámica -->
                        <div class="col-md-6 text-center">
                            <!-- Este ID 'imagenVisualizacion' servirá para cambiar el src mediante JS según la selección -->
                            <img id="imagenVisualizacion" src="..." class="img-fluid rounded" alt="Imagen del producto">
                        </div>

                        <!-- COLUMNA DERECHA: Información y Controles de Personalización -->
                        <div id="render-productos" class="col-md-6">
                            <!-- Nombre del producto -->
                            <h2 class="modal-title fw-bold mb-2" id="modalPersonalizarLabel">
                                Nombre del producto
                            </h2>

                            <!-- Descripción -->
                            <p class="text-muted mb-3 modal-descripcion" id="modalDescripcion"></p>

                            <!-- Precio -->
                            <h3 class="fw-bold mb-2 modal-precio" id="modalPrecio"></h3>

                            <!-- Stock -->
                            <p class="text-success small mb-3" id="modalStock">
                                <i class="bi bi-box-seam"></i>
                            </p>

                            <hr class="my-3">

                            <!-- Colores -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    🎨 Colores disponibles
                                </label>

                                <div id="modalColores" class="d-flex gap-2 flex-wrap"></div>
                            </div>

                            <!-- Tamaños -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    📏 Tamaños disponibles
                                </label>

                                <div id="modalTamanios" class=" gap-2 flex-wrap modal-tamaños"></div>
                            </div>

                            <!-- Agregar al carrito -->
                            <div class="d-grid">
                                <button type="button"
                                    class="btn btn-add-cart btn-lg d-flex align-items-center justify-content-center gap-2" 
                                    id="btnAgregarDesdeModal" data-id="101"    data-bs-target="#offcanvasCart">
                                   <i class="bi bi-cart-plus-fill"> Agregar al carrito</i>
                                    
                                </button>
                
                            </div>

                            
                        </div>


                    </div>
                </div>
            </div>

            <script>
                (function () {
                    const carrito = document.getElementById('offcanvasCart');
                    if (!carrito) return;
                    const lista = carrito.querySelector('ul.list-group');
                    const totalBadge = carrito.querySelector('li.fw-bold .badge');
                    function recalcularTotal() {
                        let total = 0;
                        lista.querySelectorAll('li[data-precio]').forEach(li => {
                            total += parseInt(li.getAttribute('data-precio'), 10) || 0;
                        });
                        if (totalBadge) totalBadge.textContent = '$' + total.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                    }
                    carrito.addEventListener('click', function (e) {
                        const btn = e.target.closest('button.btn-outline-danger');
                        if (!btn) return;
                        const li = btn.closest('li[data-precio]');
                        if (li) {
                            li.remove();
                            recalcularTotal();
                        }
                    });
                })();
            </script>

            <!-- Bootstrap JS -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <!-- personal JS -->  
            <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>   sweet alert
            <script src="../JS/Productos/Productos.js"></script>
            <script src="../JS/Carrito/Carrito.js"></script>
            <script src="../JS/components.js"></script>
</body>

</html>
