<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftcraft</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Iconos Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- Fuentes: pixel (títulos) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Gugi&family=Londrina+Shadow&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Rubik+Spray+Paint&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Fascinate&family=Gugi&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Londrina+Shadow&family=Oswald:wght@200..700&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Rubik+Spray+Paint&family=Silkscreen:wght@400;700&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">


    <!--css-->
    <link href="../../CSS/Login-CSS/login.css" rel="stylesheet">
</head>


<body>
    <!--Header-->
    <div id="header-placeholder"></div>

    <div class="mc-bg">
        <div class="mc-card">
            <div class="mc-block"></div>
            <h1 class="mc-title">GIFTCRAFT</h1>
            <div> <label id="mainTitle"></label></div>

            <div class="mc-tabs">
                <button class="mc-tab active" data-tab="login">INICIAR SESIÓN</button>
                <button class="mc-tab" data-tab="register">REGISTRARSE</button>
            </div>
            <!--LOGIN-->
            <form class="mc-form active" id="mcFormLogin">
                <div class="mc-field">
                    <label for="mc-user">Correo</label>
                    <input type="text" id="mc-user" class="mc-input" placeholder="Steve" required>
                </div>
                <div class="mc-field">
                    <label for="mc-pass">Contraseña</label>
                    <input type="password" id="mc-pass" class="mc-input" placeholder="••••••" required>
                </div>
                <button type="submit" class="mc-btn">ENTRAR</button>
            </form>

            <form class="mc-form" id="mcFormRegister">
                <div class="mc-field">
                    <label for="mc-reg-name"><i class="bi bi-person-fill me-1"></i> Nombre completo</label>
                    <input type="text" id="mc-reg-name" class="mc-input" placeholder="Ej. Steve Minecraft" required>
                </div>

                <div class="mc-field">
                    <label for="mc-reg-phone"><i class="bi bi-telephone-fill me-1"></i> Número de teléfono</label>
                    <input type="number" id="mc-reg-phone" class="mc-input" placeholder="Ej. 3001234567" required>
                </div>

                <div class="mc-field">
                    <label for="mc-reg-email"><i class="bi bi-envelope-at-fill me-1"></i> Correo Electronico</label>
                    <input type="email" id="mc-reg-email" class="mc-input" placeholder="usuario o tu@correo.com"
                        required>
                </div>

                <div class="mc-field">
                    <label for="mc-reg-pass"><i class="bi bi-lock-fill me-1"></i> Contraseña</label>
                    <div class="mc-password-wrapper">
                        <input type="password" id="mc-reg-pass" class="mc-input" placeholder="Mínimo 6 caracteres"
                            required>
                        <i class="bi bi-eye-slash mc-toggle-pass" id="togglePassReg" title="Mostrar contraseña"></i>
                    </div>
                </div>

                <div class="mc-field">
                    <label for="mc-reg-pass-confirm"><i class="bi bi-shield-lock-fill me-1"></i> Verificar
                        contraseña</label>

                    <div class="mc-password-wrapper">
                        <input type="password" id="mc-reg-pass-confirm" class="mc-input"
                            placeholder="Repite tu contraseña" required>
                        <i class="bi bi-eye-slash mc-toggle-pass" id="togglePassRegConfirm"
                            title="Mostrar contraseña"></i>
                    </div>
                </div>

                <button type="submit" class="mc-btn" id="mc-btn-crear">Crear cuenta</button>
            </form>

            <div class="mc-footer" id="mcFooterLogin">
                ¿No tienes cuenta? <a href="#" id="mcToRegister">Regístrate</a>
            </div>
            <div class="mc-footer" id="mcFooterRegister" style="display:none;">
                ¿Ya tienes cuenta? <a href="#" id="mcToLogin">Inicia sesión</a>
            </div>
            <div class="mc-footer">
                Entrar al dashboard <a href="../Admin/Dashboard.html">aqui</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- personal JS -->
    <script src="/JS/Login-js/Login.js"> </script>
    <script src="../../JS/components.js"></script>
</body>

</html>
